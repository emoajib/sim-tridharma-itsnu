name: CI Pipeline

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.env*'
      - 'backup*'
  pull_request:
    branches: [main]

# ============================================
# OPTIMASI #1: Cancel in-progress runs
# Push baru → cancel run lama → hemat runner time
# ============================================
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: testing
  CACHE_STORE: array
  SESSION_DRIVER: array
  QUEUE_CONNECTION: sync
  BROADCAST_CONNECTION: null

jobs:
  laravel-feature:
    name: Laravel Feature (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        php: [8.3]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, redis
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate key
        run: php artisan key:generate

      - name: Run migration
        run: php artisan migrate --force

      - name: Run Feature tests
        run: php artisan test --testsuite=Feature
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

  laravel-unit:
    name: Laravel Unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        php: [8.3]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, redis
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate key
        run: php artisan key:generate

      - name: Run migration
        run: php artisan migrate --force

      - name: Run Unit tests
        run: php artisan test --testsuite=Unit
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci 2>/dev/null || npm install --legacy-peer-deps --no-audit --no-fund

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run frontend tests
        run: npx vitest run --reporter=verbose

      - name: Build assets
        run: npm run build

  python-agents:
    name: Python AI Agents
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ai-agents

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Python syntax check
        run: python3 -m py_compile main.py agents_mcp/tools.py agents_mcp/database.py agents_mcp/auth.py

      - name: Run Python tests (if exist)
        run: python3 -m pytest tests/ -v || echo "No Python tests yet"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Run Laravel security check
        run: |
          npm audit --audit-level=high || true

      - name: Check for hardcoded secrets
        run: |
          # Check for common secret patterns
          ! rg 'AIzaSy[A-Za-z0-9_-]{33}' .env 2>/dev/null || echo "WARNING: Google API key may be exposed"
          ! rg 'sk-[A-Za-z0-9]{32,}' . 2>/dev/null || echo "WARNING: Possible API key exposed"
