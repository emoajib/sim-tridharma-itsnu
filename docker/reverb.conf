; ====================================================================
; Laravel Reverb WebSocket Server Configuration for Supervisor
; ====================================================================
;
; Usage:
;   Include in supervisord.conf via:
;     [include]
;     files = /var/www/docker/*.conf
;
;   Or run standalone:
;     supervisord -c /var/www/docker/reverb.conf

[program:reverb]
command=php /var/www/artisan reverb:start
autostart=true
autorestart=true
startretries=5
user=www-data
stdout_logfile=/var/www/storage/logs/reverb.log
stderr_logfile=/var/www/storage/logs/reverb-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
