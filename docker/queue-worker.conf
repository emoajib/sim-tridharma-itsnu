; ====================================================================
; Queue Worker Configuration for Supervisor
; Manages: Laravel queue:work with Redis backend
; ====================================================================
;
; Usage:
;   Include in supervisord.conf via:
;     [include]
;     files = /var/www/docker/*.conf
;
;   Or run standalone:
;     supervisord -c /var/www/docker/queue-worker.conf

[program:queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
numprocs=2
autostart=true
autorestart=true
startretries=5
user=www-data
stdout_logfile=/var/www/storage/logs/queue-worker.log
stderr_logfile=/var/www/storage/logs/queue-worker-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
