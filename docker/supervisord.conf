; ====================================================================
; Supervisor Configuration — Production
; Manages: php-fpm, nginx, queue-worker (x2), reverb
; ====================================================================

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/var/www/storage/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=3
loglevel=info
pidfile=/tmp/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; ────────────────────────────────────────────────────────────────────
; PHP-FPM
; ────────────────────────────────────────────────────────────────────
[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
startretries=5
stdout_logfile=/var/www/storage/logs/php-fpm.log
stderr_logfile=/var/www/storage/logs/php-fpm-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

; ────────────────────────────────────────────────────────────────────
; Nginx
; ────────────────────────────────────────────────────────────────────
[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
startretries=5
stdout_logfile=/var/www/storage/logs/nginx.log
stderr_logfile=/var/www/storage/logs/nginx-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

; ────────────────────────────────────────────────────────────────────
; Queue Worker (Redis) — 2 processes for parallel processing
; ────────────────────────────────────────────────────────────────────
[program:queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work redis --sleep=3 --tries=3 --backoff=4,10,30 --max-time=3600
numprocs=2
autostart=true
autorestart=true
startretries=5
user=www-data
stdout_logfile=/var/www/storage/logs/queue-worker.log
stderr_logfile=/var/www/storage/logs/queue-worker-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

; ────────────────────────────────────────────────────────────────────
; Laravel Reverb WebSocket Server
; ────────────────────────────────────────────────────────────────────
[program:reverb]
command=php /var/www/artisan reverb:start
autostart=true
autorestart=true
startretries=5
user=www-data
stdout_logfile=/var/www/storage/logs/reverb.log
stderr_logfile=/var/www/storage/logs/reverb-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
