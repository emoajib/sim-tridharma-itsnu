# ====================================================================
# Nginx Configuration for Laravel — Production
# Managed by Supervisor inside Docker container
# ====================================================================

server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /var/www/public;

    index index.php;

    charset utf-8;

    # ── Security Headers ────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Gzip ────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_proxied any;
    gzip_min_length 256;

    # ── Logging ─────────────────────────────────────────────────────
    access_log /var/www/storage/logs/nginx-access.log;
    error_log  /var/www/storage/logs/nginx-error.log warn;

    # ── Upload Size ─────────────────────────────────────────────────
    client_max_body_size 64m;

    # ── Static Files ────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # ── Build Assets (Vite/Webpack) ─────────────────────────────────
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Storage (public) ────────────────────────────────────────────
    location /storage/ {
        try_files $uri /index.php?$query_string;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ── PHP-FPM ─────────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 300;
    }

    # ── Deny Hidden Files ──────────────────────────────────────────
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Deny Sensitive Directories ──────────────────────────────────
    location ~ ^/(storage/app/(?!public)|bootstrap|cache|config|database|resources|routes|vendor) {
        deny all;
        internal;
    }

    # ── Error Pages ─────────────────────────────────────────────────
    error_page 404 /index.php;
    error_page 500 502 503 504 /index.php;
}
