# ====================================================================
# Docker Compose — Full Stack Orchestration
# Services:
#   app         : Laravel (PHP-FPM + Nginx + Queue Worker + Reverb)
#   postgres    : PostgreSQL 16 with pgvector extension
#   redis       : Redis 7 (queue, cache, reverb scaling)
#   ai-agents   : Python MCP Agent Service
#   rag-service : Python RAG Embedding/QA Service
# ====================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── Laravel Application ────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "8080:8080"   # Reverb WebSocket
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      # ── Override for Docker network ────────────────────────────────
      APP_ENV: production
      APP_DEBUG: false
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: sim_tridharma_itsnu
      DB_USERNAME: salsabil
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      SESSION_DRIVER: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      # ── Agent & AI Service URLs ────────────────────────────────────
      AGENT_AI_URL: http://ai-agents:8001
      MCP_AGENTS_URL: http://ai-agents:8001
      MCP_RAG_URL: http://rag-service:5001
      AI_SERVICE_URL: http://rag-service:5001
      # ── Reverb ──────────────────────────────────────────────────────
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    volumes:
      - storage_data:/var/www/storage
    logging: *default-logging
    restart: unless-stopped

  # ── PostgreSQL 16 + pgvector ───────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: sim_tridharma_itsnu
      POSTGRES_USER: salsabil
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salsabil -d sim_tridharma_itsnu"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    restart: unless-stopped

  # ── Redis 7 ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  # ── AI Agents (Python MCP Service) ─────────────────────────────────
  ai-agents:
    build:
      context: ai-agents/
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: ai-agents/.env
    environment:
      # ── Override for Docker network ────────────────────────────────
      DATABASE_URL: postgresql://salsabil:${DB_PASSWORD}@postgres:5432/sim_tridharma_itsnu
      REDIS_URL: redis://redis:6379/0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sim_tridharma_itsnu
      DB_USER: salsabil
      DB_PASSWORD: ${DB_PASSWORD}
      LARAVEL_URL: http://app:80
    logging: *default-logging
    restart: unless-stopped

  # ── RAG Service (Python Embedding/QA Service) ──────────────────────
  rag-service:
    build:
      context: ai-service/
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ai-service/.env
    environment:
      AI_SERVICE_PORT: 5001
      TORCH_THREADS: 2
    logging: *default-logging
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
  storage_data:
    driver: local
